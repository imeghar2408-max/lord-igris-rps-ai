<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lord Igris - The Grandmaster</title>

    <link rel="stylesheet" href="rpsstyle.css">
</head>
<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <h1>⚔️ LORD IGRIS</h1>

        <p class="subtitle">
            The Grandmaster of Strategy
        </p>

    </header>

    <!-- ================= AI TERMINAL ================= -->

    <section class="terminal">

        <div class="terminal-header">

            <span class="green"></span>
            <span class="yellow"></span>
            <span class="red"></span>

            <h2>IGRIS TERMINAL</h2>

        </div>

        <div class="terminal-body">

            <p id="ai-message">

                Initializing...

            </p>

        </div>

    </section>

    <!-- ================= SCORE ================= -->

    <section class="score-board">

        <div class="score-card">

            <h3>HUMAN</h3>

            <p id="player-score">0</p>

        </div>

        <div class="vs">

            VS

        </div>

        <div class="score-card">

            <h3>LORD IGRIS</h3>

            <p id="computer-score">0</p>

        </div>

    </section>

    <!-- ================= GAME ================= -->

    <main class="game-container">

        <!-- HUMAN -->

        <section class="player-card">

            <div class="card-title">

                🔴 LIVE CAMERA

            </div>

           <div class="camera-container">

    <video
        id="webcam"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="output-canvas"></canvas>

</div>

            <p id="player-move">

                Waiting for gesture...

            </p>

        </section>

        <!-- COMPUTER -->

        <section class="computer-card">

            <div class="card-title">

                ⚔️ LORD IGRIS

            </div>

            <div id="computer-choice">

                ?

            </div>

            <p id="computer-move">

                Awaiting challenge...

            </p>

        </section>

    </main>

    <!-- ================= COUNTDOWN ================= -->

    <section id="countdown">

    </section>

    <!-- ================= RESULT ================= -->

    <section class="result">

        <h2 id="result-text">

            Press Challenge the Grandmaster to start

        </h2>

    </section>

    <!-- ================= BUTTONS ================= -->

    <section class="controls">

        <button id="start-btn">

            ⚔️ Challenge the Grandmaster ⚔️

        </button>

        <button id="reset-btn">

            🔄 Reset Game

        </button>

    </section>
<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>



    <script src="rpsscript-old.js"></script>

</body>
</html>
